name: One-shot gzip OUI migration

on:
  push:
    branches:
      - feature/compact-mac-vendor-db
    paths:
      - .github/workflows/one-shot-gzip-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-mac-vendor-db
      - name: Apply gzip migration
        run: python3 tools/one-shot-gzip-migration.py
      - name: Validate syntax before commit
        run: |
          node --check app.js
          node --check standalone-builder-core.js
          node --check standalone-builder.js
          node --check sw.js
          python3 -m py_compile tools/build-oui-db.py
          node --test
      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Serve compact OUI database as gzip"
          git push origin HEAD:feature/compact-mac-vendor-db
