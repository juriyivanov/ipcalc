name: Build compact OUI database

on:
  push:
    branches:
      - feature/compact-mac-vendor-db
    paths:
      - oui-db.json
      - tools/build-oui-db.py
      - .github/workflows/build-compact-oui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-mac-vendor-db
          fetch-depth: 0
      - name: Build and verify compact database
        run: python3 tools/build-oui-db.py --input-json oui-db.json -o oui-db.bin
      - name: Replace legacy JSON database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oui-db.bin
          git rm oui-db.json
          git diff --cached --stat
          git commit -m 'Replace JSON OUI database with compact binary format'
          git push origin HEAD:feature/compact-mac-vendor-db
